services:
  netguard:
    build: .
    restart: unless-stopped
    ports:
      # 127.0.0.1 uniquement : seul le reverse proxy (Caddy/Nginx) y accède.
      - "127.0.0.1:5050:5050"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5050
      - COOKIE_SECURE=true
      - DB_PATH=/app/data/netguard.db
    volumes:
      # Persiste la base SQLite hors du conteneur (survit aux rebuilds).
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5050/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
