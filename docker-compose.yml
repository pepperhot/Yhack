services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netguard
      POSTGRES_USER: netguard
      POSTGRES_PASSWORD: netguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  netguard:
    build: .
    ports:
      - "3000:5050"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5050
      - DATABASE_URL=postgresql://netguard:netguard@postgres:5432/netguard

volumes:
  pgdata:
